# 前端那台(主機 nginx,不是容器)的 blog site —— 這一份是版控正本(決策 11-1,票 04 ③、⑦)。
# 套用到伺服器(/etc/nginx/sites-available/ 的那個檔)由需求方親手做;套用前先與伺服器上正在跑的那份比對:
#   ssh linode-blog "sudo nginx -T 2>/dev/null | sed -n '/server_name.*learn-or-die/,/^}/p'"
# 2026-11-10 依票 03 盤查到的事實寫成:server_name、root、try_files、TLS 由 Certbot 管;
# 憑證路徑是 Certbot 的預設形狀,實際檔名以伺服器為準;伺服器的 nginx 是 nginx/1.18.0(2026-11-10 `ssh linode-blog "/usr/sbin/nginx -v"` 量到);本檔當天在 nginx 1.18.0、1.24.0 與最新的 alpine 映像跑 nginx -t 都通過。
#
# 票 05 要做的事只有一件:把最下面那個只回報的標頭名改成正式的 CSP 標頭名(來源清單用上面的 $csp_* 變數組的)。

server {
    listen 80;
    listen [::]:80;
    server_name learn-or-die.com blog.learn-or-die.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learn-or-die.com blog.learn-or-die.com;

    ssl_certificate /etc/letsencrypt/live/blog.learn-or-die.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.learn-or-die.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/blog/build;
    index index.html;

    # 決策 11-1 (b)(c)(d)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 決策 11-1 CSP 第一階段:只回報。來源清單一個外部服務一行,票 05 補來源時改這裡。
    # index.html 的 gtag 是 inline script ⇒ script-src 暫時要 'unsafe-inline';mermaid 與 mapbox-gl 注入 inline 樣式 ⇒ style-src 'unsafe-inline';
    # cesium 會載 wasm ⇒ 'wasm-unsafe-eval'。
    set $csp_default   "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';";
    set $csp_script    "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com;";
    set $csp_style     "style-src 'self' 'unsafe-inline';";
    set $csp_img       "img-src 'self' data: blob: https:;";
    set $csp_font      "font-src 'self' data:;";
    set $csp_api       "https://blog-api.learn-or-die.com";
    set $csp_mapbox    "https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com";
    set $csp_wc        "https://*.walletconnect.com wss://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.org";
    set $csp_ga        "https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com";
    set $csp_connect   "connect-src 'self' $csp_api $csp_mapbox $csp_wc $csp_ga;";
    set $csp_frame     "frame-src https://www.youtube.com https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org;";
    set $csp_worker    "worker-src 'self' blob:; child-src blob:;";
    set $csp_media     "media-src 'self' $csp_api;";
    # 報告送到後端 POST /api/v1/csp-reports(票 04 ⑦):report-uri 給舊瀏覽器,report-to 給 Reporting API。
    set $csp_report    "report-uri $csp_api/api/v1/csp-reports; report-to csp-endpoint";
    add_header Reporting-Endpoints 'csp-endpoint="https://blog-api.learn-or-die.com/api/v1/csp-reports"' always;
    add_header Content-Security-Policy-Report-Only "$csp_default $csp_script $csp_style $csp_img $csp_font $csp_connect $csp_frame $csp_worker $csp_media $csp_report" always;

    # SPA:所有路由都回 index.html,由 React Router 接手。
    # 刻意不另開 location 給靜態檔:nginx 的 add_header 在有自己 add_header 的 location 裡不會繼承,
    # 多開一個 location 就得把上面每一行再抄一次。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
